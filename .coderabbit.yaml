language: "en-US"
early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - "main"
      - "development"
  path_filters:
    - "!**/node_modules/**"
    - "!**/vendor/**"
    - "!**/dist/**"
    - "!package-lock.json"
    - "!pnpm-lock.yaml"
    - "!yarn.lock"
    # Temporary for PR #133. Remove after this review.
    - "!context/README.md"
    - "!context/progress-checker.md"
    - "!docs/operations/backup-format.md"
    - "!docs/operations/phase-2-season-migration.md"
    - "!docs/operations/regulation-activation.md"
    - "!docs/operations/scheduling.md"
    - "!docs/verification/phase-2/audit-history-business-execution.md"
    - "!docs/verification/phase-2/club-media-backup.md"
    - "!docs/verification/phase-2/later-fact-ports-and-fixtures.md"
    - "!docs/verification/phase-2/ordered-business-execution.md"
    - "!docs/verification/phase-2/preflight.md"
    - "!docs/verification/phase-2/regulation-approval.md"
    - "!docs/verification/phase-2/regulation-draft.md"
    - "!docs/verification/phase-2/regulation-submission.md"
    - "!docs/verification/phase-2/schema-migration.md"
    - "!docs/verification/phase-2/season-creation.md"
    - "!docs/verification/phase-2/season-metadata.md"
    - "!docs/verification/phase-2/session-transport.md"
    - "!docs/verification/phase-2/t001-t015-regression.md"
    - "!specs/002-phase-2-season-regulations/documentation-audit.md"
    - "!specs/002-phase-2-season-regulations/spec.md"
    - "!specs/002-phase-2-season-regulations/tasks.md"
